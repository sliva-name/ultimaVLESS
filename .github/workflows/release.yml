name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release-version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes and bumped version with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --bump --verbose
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: release-version
        run: |
          NEXT_VERSION="${{ steps.git-cliff.outputs.version }}"
          NEXT_VERSION="${NEXT_VERSION#v}"
          if [ -z "$NEXT_VERSION" ]; then
            echo "git-cliff did not return a bumped version."
            exit 1
          fi
          TAG_NAME="v${NEXT_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release tag ${TAG_NAME} already exists. This version has already been released."
            exit 1
          fi
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Update package version
        run: npm version "${{ steps.release-version.outputs.version }}" --no-git-tag-version

      - name: Create release tag
        run: |
          git add package.json package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(release): ${{ steps.release-version.outputs.tag_name }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag "${{ steps.release-version.outputs.tag_name }}"
          git push origin "refs/tags/${{ steps.release-version.outputs.tag_name }}"

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-version.outputs.tag_name }}
          name: ${{ steps.release-version.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true

  build-linux:
    name: Build & Publish Linux
    needs: create-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify CI gates
        run: npm run verify:ci

      - name: Verify Linux release config
        run: npm run verify:release:linux

      - name: Prepare Xray assets
        run: npm run prepare:xray:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate app icon files exist
        run: |
          required_icons=("resources/bin/logo-256x256.png")
          for icon_path in "${required_icons[@]}"; do
            if [ ! -f "$icon_path" ]; then
              echo "Missing required icon asset in repository: $icon_path"
              exit 1
            fi
          done

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build Linux artifacts
        run: |
          npm run build:electron
          npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Build SHA256 checksums
        run: |
          mapfile -t files < <(find release -type f \( -name "*.AppImage" -o -name "*.deb" \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .AppImage/.deb artifacts were produced"
            exit 1
          fi
          > release/SHA256SUMS-linux.txt
          for file in "${files[@]}"; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            echo "$hash  $file" >> release/SHA256SUMS-linux.txt
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/latest-linux*.yml
            release/**/*.AppImage.blockmap
            release/SHA256SUMS-linux.txt

  build-macos:
    name: Build & Publish macOS
    needs: create-release
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify CI gates
        run: npm run verify:ci

      - name: Verify macOS release config
        run: npm run verify:release:mac

      - name: Prepare Xray assets
        run: npm run prepare:xray:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate macOS icns icon when missing
        run: |
          if [ -f "resources/bin/logo.icns" ]; then
            echo "logo.icns already exists"
            exit 0
          fi
          if [ ! -f "resources/bin/logo-256x256.png" ]; then
            echo "Missing source icon for icns generation: resources/bin/logo-256x256.png"
            exit 1
          fi

          ICONSET_DIR="$RUNNER_TEMP/logo.iconset"
          rm -rf "$ICONSET_DIR"
          mkdir -p "$ICONSET_DIR"

          sips -z 16 16 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32 32 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32 32 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64 64 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128 128 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256 256 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256 256 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512 512 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512 512 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_512x512.png"
          sips -z 1024 1024 resources/bin/logo-256x256.png --out "$ICONSET_DIR/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET_DIR" -o resources/bin/logo.icns
          echo "Generated resources/bin/logo.icns"

      - name: Validate app icon files exist
        run: |
          required_icons=("resources/bin/logo.icns" "resources/bin/logo-256x256.png")
          for icon_path in "${required_icons[@]}"; do
            if [ ! -f "$icon_path" ]; then
              echo "Missing required icon asset in repository: $icon_path"
              exit 1
            fi
          done

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build macOS artifacts
        run: |
          npm run build:electron
          npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Build SHA256 checksums
        run: |
          files_found="$(find release -type f \( -name "*.dmg" -o -name "*.zip" \))"
          if [ -z "$files_found" ]; then
            echo "No .dmg/.zip artifacts were produced"
            exit 1
          fi
          > release/SHA256SUMS-macos.txt
          while IFS= read -r file; do
            hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            echo "$hash  $file" >> release/SHA256SUMS-macos.txt
          done <<< "$files_found"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            release/**/*.dmg
            release/**/*.zip
            release/**/latest-mac*.yml
            release/**/*.dmg.blockmap
            release/**/*.zip.blockmap
            release/SHA256SUMS-macos.txt

  build-windows:
    name: Build & Publish Windows
    needs: create-release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.create-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify CI gates
        run: npm run verify:ci

      - name: Verify Windows release config
        run: npm run verify:release:win

      - name: Prepare Xray assets
        run: npm run prepare:xray:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate app icon files exist
        shell: pwsh
        run: |
          $requiredIcons = @("resources/bin/logo.ico", "resources/bin/logo-256x256.png")
          foreach ($iconPath in $requiredIcons) {
            if (-not (Test-Path $iconPath)) {
              throw "Missing required icon asset in repository: $iconPath"
            }
          }

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Build Windows artifacts
        shell: pwsh
        run: |
          npm run build:electron
          npx electron-builder --win nsis portable --x64 --publish never

      - name: Build SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release" -Recurse -File -Include *.exe
          if (-not $files) {
            throw "No .exe artifacts were produced"
          }
          $output = @()
          foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            $relative = Resolve-Path -Relative -Path $file.FullName
            $output += "$hash  $relative"
          }
          $output | Set-Content -Path "release/SHA256SUMS-windows.txt" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            release/**/UltimaVLESS-Setup-*.exe
            release/**/UltimaVLESS-Portable-*.exe
            release/**/latest.yml
            release/**/*.exe.blockmap
            release/SHA256SUMS-windows.txt
